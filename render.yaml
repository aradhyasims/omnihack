# Render Blueprint for OmniHack (web service; database and file storage on Supabase).
# Secrets (DATABASE_URL, APP_SECRET, ENCRYPTION_KEY, AWS_* for Supabase Storage, RESEND_API_KEY) are set
# in the Render dashboard, never in this file. See docs/DEPLOYMENT.md → "Render + Supabase".
services:
  - type: web
    name: omnihack
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    # Free plan has no pre-deploy step: the image's start.sh applies migrations when MIGRATE_ON_START=true.
    # The background worker runs inside the web process (src/instrumentation.ts).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: "true"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "OmniHack <no-reply@omnihack.tech>"
      - key: RESEND_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: local
