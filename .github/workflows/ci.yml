# Continuous integration: every push / PR must pass these checks before deployment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: omnihack
          POSTGRES_PASSWORD: omnihack
          POSTGRES_DB: omnihack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnihack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://omnihack:omnihack@localhost:5432/omnihack_test?schema=public
      TEST_DATABASE_URL: postgresql://omnihack:omnihack@localhost:5432/omnihack_test?schema=public
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npx eslint .
      - name: Type check
        run: npm run typecheck
      - name: Validate Prisma schema & migrations
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://omnihack:omnihack@localhost:5432/postgres" --exit-code
      - name: Unit & integration tests (incl. API authorization)
        run: npm test
      - name: Production build
        run: npm run build && npm run build:worker
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: omnihack, POSTGRES_PASSWORD: omnihack, POSTGRES_DB: omnihack_dev }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U omnihack" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://omnihack:omnihack@localhost:5432/omnihack_dev?schema=public
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      SEED_ADMIN_PASSWORD: OmniHack!Demo2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
